<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}印刷機登録・照合端末{% endblock %}</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; margin: 0; background: #f5f6f8; color: #1a1a1a; }
  nav { background: #1f2937; padding: 12px 24px; }
  nav a { color: #fff; text-decoration: none; margin-right: 20px; font-size: 14px; }
  nav a:hover { text-decoration: underline; }
  main { max-width: 820px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 12px; border-radius: 6px; overflow: hidden; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #e5e7eb; font-size: 13px; text-align: left; }
  th { background: #eef0f3; }
  form { background: #fff; padding: 20px; border-radius: 8px; margin-top: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  label { display: block; margin-top: 12px; font-size: 13px; font-weight: 600; }
  input, select { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
  button { margin-top: 16px; padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  button:hover { background: #1d4ed8; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge-registered { background: #dcfce7; color: #166534; }
  .badge-not_registered { background: #e5e7eb; color: #374151; }
  .badge-tamper_suspected { background: #fee2e2; color: #991b1b; }
  .chain-ok { color: #166534; font-weight: 600; }
  .chain-bad { color: #991b1b; font-weight: 700; }
  .result-box { background: #fff; padding: 20px; border-radius: 8px; margin-top: 16px; }
  .muted { color: #6b7280; font-size: 12px; }
</style>
</head>
<body>
<nav>
  <a href="{{ url_for('index') }}">ダッシュボード</a>
  <a href="{{ url_for('register') }}">登録</a>
  <a href="{{ url_for('verify') }}">照合</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
